<script>

/* ---------- ฐานข้อมูล ---------- */

const KEY = 'dmldl_v1';

let db = JSON.parse(localStorage.getItem(KEY) || 'null') || {

  profile: { name: '', age: '', sex: 'ชาย', ht: '' },

  goals: { step: 8000, veg: 5, ex: 150, grain: 7, fish: 3, fried: 2, sweet: 2, stress: 5 },

  logs: {}, 

  labs: []

};

const save = () => localStorage.setItem(KEY, JSON.stringify(db));

const $ = id => document.getElementById(id);

const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };

const today = iso(new Date());

const thDate = s => { const d = new Date(s); return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }); };


function toast(m) {

  const t = $('toast');

  t.textContent = m;

  t.classList.add('show');

  setTimeout(() => t.classList.remove('show'), 2200);

}


/* ---------- Google Sheets Integration ---------- */

const API_URL = 'https://script.google.com/macros/s/AKfycbwF-Gllj1oZ8e9ivIKVpwC9lH0C2OuT_JhjpDXM5zUtxIdIoerlm32Edv1NzweiJubnsw/exec';

let PID = localStorage.getItem('dmldl_pid') || '';


function setPid() {

  const v = $('pidInput').value.trim();

  if (!v) { toast('กรุณากรอกรหัสผู้ป่วย'); return; }

  PID = v;

  localStorage.setItem('dmldl_pid', v);

  $('syncState').textContent = '✅ เชื่อมต่อแล้ว: ' + v;

  toast('ตั้งค่ารหัสผู้ป่วยแล้ว');

}


function send(payload) {

  if (!PID) return;

  payload.pid = PID;

  fetch(API_URL, {

    method: 'POST',

    headers: { 'Content-Type': 'text/plain;charset=utf-8' },

    body: JSON.stringify(payload)

  })

  .then(r => r.json())

  .then(r => $('syncState').textContent = r.ok ? '✅ บันทึกออนไลน์แล้ว' : '❌ บันทึกไม่สำเร็จ')

  .catch(() => $('syncState').textContent = '📴 ออฟไลน์');

}


/* ---------- การนำทาง ---------- */

function go(v) {

  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === v));

  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.v === v));

  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (v === 'home') renderHome();

  if (v === 'week') renderWeek();

  if (v === 'lab') renderLab();

  if (v === 'daily') loadDay();

}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));


/* ---------- บันทึกรายวัน ---------- */

$('d_date').value = today;

$('d_date').onchange = loadDay;


function loadDay() {

  const d = db.logs[$('d_date').value] || {};

  $('d_veg').value = d.veg || 0; $('d_grain').value = d.grain || 0; 

  $('d_fish').value = d.fish || 0; $('d_fried').value = d.fried || 0; 

  $('d_sweet').value = d.sweet || 0; $('d_chol').value = d.chol || 0;

  $('d_step').value = d.step || 0; $('d_ex').value = d.ex || 0; 

  $('d_med').value = d.med || '1';

  $('d_stress').value = d.stress || 3; $('stressVal').textContent = d.stress || 3;

  $('d_wt').value = d.wt || ''; $('d_bs').value = d.bs || ''; 

  $('d_wc').value = d.wc || ''; $('d_note').value = d.note || '';

}


function saveDay() {

  const k = $('d_date').value;

  if (!k) { toast('กรุณาเลือกวันที่'); return; }

  const n = id => +$(id).value || 0;

  db.logs[k] = {

    veg: n('d_veg'), grain: n('d_grain'), fish: n('d_fish'), fried: n('d_fried'), 

    sweet: n('d_sweet'), chol: n('d_chol'), step: n('d_step'), ex: n('d_ex'), 

    med: +$('d_med').value, stress: n('d_stress'), wt: $('d_wt').value, 

    bs: $('d_bs').value, wc: $('d_wc').value, note: $('d_note').value

  };

  save(); toast('✅ บันทึกเรียบร้อย');

  send(Object.assign({ type: 'daily', date: k }, db.logs[k]));

  renderHome();

}


/* ---------- ส่วนอื่นๆ (เรียกใช้ฟังก์ชันเดิมของคุณ) ---------- */

function renderHome() { /* โค้ดเดิมของคุณ */ }

function renderWeek() { /* โค้ดเดิมของคุณ */ }

function renderLab() { /* โค้ดเดิมของคุณ */ }

function saveLab() { /* โค้ดเดิมของคุณ */ }

function loadSet() { /* โค้ดเดิมของคุณ */ }

function saveSet() { /* โค้ดเดิมของคุณ */ }

function exportJSON() { /* โค้ดเดิมของคุณ */ }

function exportCSV() { /* โค้ดเดิมของคุณ */ }

function clearAll() { /* โค้ดเดิมของคุณ */ }


/* ---------- เริ่มต้น ---------- */

loadSet(); loadDay(); renderHome(); renderWeek(); renderLab();

if (PID) { $('pidInput').value = PID; $('syncState').textContent = '✅ เชื่อมต่อแล้ว: ' + PID; }

</script>
